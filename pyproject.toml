[project]
name = "jarvis"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.5.0",
]
spike = [
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.5",
    "onnxruntime>=1.32.0",
    "openwakeword>=0.6",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.uv]
environments = ["sys_platform == 'darwin'"]  # Jarvis is Mac-only
default-groups = ["dev", "spike"]  # so uv add/remove/sync never strips the spike packages
