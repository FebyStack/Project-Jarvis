[project]
name = "jarvis"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "en-core-web-sm",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.5",
    "numpy",
    "onnxruntime>=1.32.0",
    "openwakeword>=0.6",
    "parakeet-mlx>=0.7.0",
    "pyobjc-framework-cocoa>=13.0",
    "pyobjc-framework-quartz>=13.0",
    "pyobjc-framework-webkit>=13.0",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.uv]
environments = ["sys_platform == 'darwin'"]  # Jarvis is Mac-only
default-groups = ["dev"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
